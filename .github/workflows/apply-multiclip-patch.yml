name: Apply multiclip source patch

on:
  push:
    branches:
      - feature/mobile-multiclip-editing
    paths:
      - tools/apply_multiclip_patch.py
      - .github/workflows/apply-multiclip-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-multiclip-editing
          fetch-depth: 0
      - name: Apply source patch
        run: python3 tools/apply_multiclip_patch.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/core/engine/ffi_engine_gateway.dart lib/features/editor/presentation/mobile_editor_screen.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Wire multiclip timeline editing into engine gateway"
          git push origin HEAD:feature/mobile-multiclip-editing
