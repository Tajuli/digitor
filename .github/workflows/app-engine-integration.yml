name: Digitor App + Engine Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android host
        run: |
          flutter create --platforms=android --project-name digitor .
          rm -rf test
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --debug

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - name: Generate Windows host
        run: flutter create --platforms=windows --project-name digitor .
      - run: flutter pub get
      - name: Provision FFmpeg through DigitorEngine package
        shell: pwsh
        run: |
          $configPath = (Resolve-Path '.dart_tool\package_config.json').Path
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $package = $config.packages | Where-Object { $_.name -eq 'digitor_engine_ffi' } | Select-Object -First 1
          if (-not $package) { throw 'digitor_engine_ffi was not found in package_config.json' }
          $uri = [Uri]$package.rootUri
          if ($uri.IsAbsoluteUri) {
            $packageRoot = $uri.LocalPath
          } else {
            $packageRoot = [IO.Path]::GetFullPath((Join-Path (Split-Path $configPath) $package.rootUri))
          }
          $provisioner = Join-Path $packageRoot 'tool\provision_ffmpeg_windows.ps1'
          if (-not (Test-Path $provisioner)) { throw "FFmpeg provisioner not found: $provisioner" }
          & $provisioner
      - run: flutter build windows --debug -v

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop --no-enable-swift-package-manager
      - name: Generate Apple hosts
        run: flutter create --platforms=ios,macos --project-name digitor .
      - run: flutter pub get
      - name: Set supported Apple deployment targets and file access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path, key, version in [
              (Path('ios/Runner.xcodeproj/project.pbxproj'), 'IPHONEOS_DEPLOYMENT_TARGET', '13.0'),
              (Path('macos/Runner.xcodeproj/project.pbxproj'), 'MACOSX_DEPLOYMENT_TARGET', '11.0'),
          ]:
              text = path.read_text()
              text = re.sub(rf'{key} = [^;]+;', f'{key} = {version};', text)
              path.write_text(text)

          for path, platform, version in [
              (Path('ios/Podfile'), 'ios', '13.0'),
              (Path('macos/Podfile'), 'osx', '11.0'),
          ]:
              text = path.read_text()
              pattern = rf'^#?\s*platform\s+:{platform},\s*[\'\"][^\'\"]+[\'\"]'
              replacement = f"platform :{platform}, '{version}'"
              if re.search(pattern, text, flags=re.MULTILINE):
                  text = re.sub(pattern, replacement, text, flags=re.MULTILINE)
              else:
                  text = replacement + '\n' + text
              path.write_text(text)

          entitlement = '<key>com.apple.security.files.user-selected.read-write</key>\n\t<true/>'
          for path in [Path('macos/Runner/DebugProfile.entitlements'), Path('macos/Runner/Release.entitlements')]:
              text = path.read_text()
              if 'com.apple.security.files.user-selected.read-write' not in text:
                  text = text.replace('</dict>', f'\t{entitlement}\n</dict>')
                  path.write_text(text)
          PY
      - run: flutter build macos --debug
      - run: flutter build ios --debug --simulator
