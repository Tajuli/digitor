name: Apply export profile fix

on:
  push:
    branches:
      - agent/test-windows-export-bridge-382
    paths:
      - .github/workflows/agent-export-profile-fix.yml

permissions:
  contents: write

jobs:
  patch-export-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-windows-export-bridge-382
          fetch-depth: 0

      - name: Patch export profile wiring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          ENGINE_SHA = '9dc886a8dc99b1755663b9953a65e369382aca16'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          gateway_path = Path('lib/core/engine/ffi_engine_gateway.dart')
          gateway = gateway_path.read_text(encoding='utf-8')

          gateway = replace_once(
              gateway,
              "  int _lastPreviewParameterRevision = -1;\n",
              "  int _lastPreviewParameterRevision = -1;\n"
              "  DigitorExportFormat _exportFormat = DigitorExportFormat.mp4;\n"
              "  DigitorVideoCodec _exportCodec = DigitorVideoCodec.h264;\n",
              'gateway export fields',
          )

          gateway = replace_once(
              gateway,
              "      'export.production',\n",
              "      'export.production',\n      'export.format',\n",
              'gateway export capability',
          )

          gateway = replace_once(
              gateway,
              "      if (action == 'export.production.start') {\n"
              "        await _exportCurrentMedia();\n"
              "        return;\n"
              "      }\n",
              "      if (action == 'export.format.profile' && value is String) {\n"
              "        switch (value) {\n"
              "          case 'MP4 · H.264':\n"
              "            _exportFormat = DigitorExportFormat.mp4;\n"
              "            _exportCodec = DigitorVideoCodec.h264;\n"
              "            break;\n"
              "          case 'MP4 · H.265 (HEVC)':\n"
              "            _exportFormat = DigitorExportFormat.mp4;\n"
              "            _exportCodec = DigitorVideoCodec.h265;\n"
              "            break;\n"
              "          default:\n"
              "            throw ArgumentError.value(\n"
              "              value, 'value', 'Unsupported production export profile.');\n"
              "        }\n"
              "        _event('exportProfileChanged', <String, Object?>{\n"
              "          'format': _exportFormat.name,\n"
              "          'codec': _exportCodec.name,\n"
              "          'profile': value,\n"
              "        });\n"
              "        _emitSnapshot(message: 'Export profile $value');\n"
              "        return;\n"
              "      }\n\n"
              "      if (action == 'export.production.start') {\n"
              "        await _exportCurrentMedia();\n"
              "        return;\n"
              "      }\n",
              'gateway export dispatch',
          )

          gateway = replace_once(
              gateway,
              "  Future<void> _exportCurrentMedia() async {\n",
              "  String _normalizedExportPath(String path) {\n"
              "    const extension = '.mp4';\n"
              "    if (path.toLowerCase().endsWith(extension)) return path;\n"
              "    final separator = math.max(path.lastIndexOf('/'), path.lastIndexOf('\\\\'));\n"
              "    final dot = path.lastIndexOf('.');\n"
              "    if (dot > separator) return '${path.substring(0, dot)}$extension';\n"
              "    return '$path$extension';\n"
              "  }\n\n"
              "  Future<void> _exportCurrentMedia() async {\n",
              'gateway path normalizer',
          )

          gateway = replace_once(
              gateway,
              "    if (location == null) {\n"
              "      _event('exportLocationRequired', const <String, Object?>{});\n"
              "      return;\n"
              "    }\n\n"
              "    final status = _w.timelineStatus();\n",
              "    if (location == null) {\n"
              "      _event('exportLocationRequired', const <String, Object?>{});\n"
              "      return;\n"
              "    }\n"
              "    final outputPath = _normalizedExportPath(location.path);\n\n"
              "    final status = _w.timelineStatus();\n",
              'gateway normalized output path',
          )

          gateway = replace_once(
              gateway,
              "      'path': location.path,\n      'frames': frameCount,\n      'durationUs': durationUs,\n",
              "      'path': outputPath,\n"
              "      'frames': frameCount,\n"
              "      'durationUs': durationUs,\n"
              "      'format': _exportFormat.name,\n"
              "      'codec': _exportCodec.name,\n",
              'gateway export event',
          )

          gateway = replace_once(
              gateway,
              "    _w.exportMedia(\n"
              "      path: location.path,\n"
              "      firstFrame: firstFrame,\n"
              "      lastFrame: lastFrame,\n"
              "      width: media.firstFrame.width,\n"
              "      height: media.firstFrame.height,\n",
              "    _w.exportMedia(\n"
              "      path: outputPath,\n"
              "      firstFrame: firstFrame,\n"
              "      lastFrame: lastFrame,\n"
              "      width: media.firstFrame.width,\n"
              "      height: media.firstFrame.height,\n"
              "      format: _exportFormat,\n"
              "      codec: _exportCodec,\n",
              'gateway native export profile',
          )

          gateway = replace_once(
              gateway,
              "    _debug('export completed ${location.path}');\n"
              "    _event('exportCompleted', <String, Object?>{'path': location.path});\n",
              "    _debug('export completed $outputPath format=${_exportFormat.name} codec=${_exportCodec.name}');\n"
              "    _event('exportCompleted', <String, Object?>{\n"
              "      'path': outputPath,\n"
              "      'format': _exportFormat.name,\n"
              "      'codec': _exportCodec.name,\n"
              "    });\n",
              'gateway export completion',
          )

          gateway_path.write_text(gateway, encoding='utf-8')

          catalog_path = Path('lib/core/engine/engine_feature_catalog.dart')
          catalog = catalog_path.read_text(encoding='utf-8')
          old_export = "  EngineUiFeature(id: 'export.production', workspace: EngineWorkspace.export, title: 'Production Export', summary: 'Shared timeline render path with progress, errors and cancellation.', controls: [EngineUiControl.action('configure', 'Settings'), EngineUiControl.action('start', 'Export')]),\n  EngineUiFeature(id: 'export.format', workspace: EngineWorkspace.export, title: 'Container / Codec', summary: 'MP4, MOV, Matroska, image sequence and supported FFmpeg codecs.', controls: [EngineUiControl.choice('container', 'Container', ['MP4', 'MOV', 'Matroska', 'Image Sequence']), EngineUiControl.choice('encoder', 'Encoder', ['Auto', 'Hardware', 'Software'])]),\n"
          new_export = "  EngineUiFeature(id: 'export.format', workspace: EngineWorkspace.export, title: 'File Type / Codec', summary: 'Native production MP4 export with the selected video codec.', controls: [EngineUiControl.choice('profile', 'File Type / Codec', ['MP4 · H.264', 'MP4 · H.265 (HEVC)'])]),\n  EngineUiFeature(id: 'export.production', workspace: EngineWorkspace.export, title: 'Production Export', summary: 'Shared timeline render path with progress, errors and cancellation.', controls: [EngineUiControl.action('start', 'Export')]),\n"
          catalog = replace_once(catalog, old_export, new_export, 'export catalog')
          catalog_path.write_text(catalog, encoding='utf-8')

          pubspec_path = Path('pubspec.yaml')
          pubspec = pubspec_path.read_text(encoding='utf-8')
          pubspec = replace_once(
              pubspec,
              'ref: 93b9fd68ccbc6887e6612c193fa1f6d3c97708dc',
              f'ref: {ENGINE_SHA}',
              'engine pin',
          )
          pubspec_path.write_text(pubspec, encoding='utf-8')
          PY

      - name: Commit patched app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/engine/ffi_engine_gateway.dart lib/core/engine/engine_feature_catalog.dart pubspec.yaml
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Fix export profiles and pin smooth-audio engine"
          git push origin HEAD:agent/test-windows-export-bridge-382
