name: Apply clean node panel placement

on:
  push:
    branches:
      - agent/move-node-panel-right-clean-20260817
    paths:
      - .github/workflows/agent-move-node-panel-right-clean.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: python3 tool/agent_move_node_panel_right.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/editor/presentation/editor_screen.dart
          git diff --cached --check
          git commit -m "Move node graph into right panel"
          git push origin HEAD:agent/move-node-panel-right-clean-20260817
