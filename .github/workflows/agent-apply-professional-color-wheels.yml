name: Apply professional color wheel integration

on:
  push:
    branches:
      - agent/davinci-style-primary-log-wheels-20260817
    paths:
      - .github/workflows/agent-apply-professional-color-wheels.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire professional Primary and Log Wheels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          editor_path = Path('lib/features/editor/presentation/editor_screen.dart')
          editor = editor_path.read_text()

          import_anchor = "import 'package:flutter/material.dart';\n"
          import_line = "import 'professional_color_wheels.dart';\n"
          assert import_anchor in editor
          if import_line not in editor:
              editor = editor.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          build_anchor = """  Widget build(BuildContext context) {\n    final inspectorFeature = selectedFeature;\n    return Scaffold(\n"""
          build_replacement = """  Widget build(BuildContext context) {\n    final inspectorFeature = selectedFeature;\n    final wideColorWheels = inspectorFeature?.id == 'color.primaryWheels' ||\n        inspectorFeature?.id == 'color.logWheels';\n    final inspectorWidth = wideColorWheels ? 620.0 : 350.0;\n    return Scaffold(\n"""
          assert build_anchor in editor
          editor = editor.replace(build_anchor, build_replacement, 1)

          width_anchor = """                  SizedBox(\n                    width: 350,\n                    child: ListView(\n"""
          width_replacement = """                  SizedBox(\n                    width: inspectorWidth,\n                    child: ListView(\n"""
          assert width_anchor in editor
          editor = editor.replace(width_anchor, width_replacement, 1)

          controls_anchor = """  Widget build(BuildContext context) {\n    if (feature.id == 'color.logWheels') {\n      return _LogWheelsControls(supported: supported, dispatch: dispatch);\n    }\n    if (feature.id == 'color.rgbCurves') {\n"""
          controls_replacement = """  Widget build(BuildContext context) {\n    if (feature.id == 'color.primaryWheels') {\n      return ProfessionalPrimaryWheelsControls(\n        supported: supported,\n        dispatch: dispatch,\n      );\n    }\n    if (feature.id == 'color.logWheels') {\n      return ProfessionalLogWheelsControls(\n        supported: supported,\n        dispatch: dispatch,\n      );\n    }\n    if (feature.id == 'color.rgbCurves') {\n"""
          assert controls_anchor in editor
          editor = editor.replace(controls_anchor, controls_replacement, 1)
          editor_path.write_text(editor)

          gateway_path = Path('lib/core/engine/ffi_engine_gateway.dart')
          gateway = gateway_path.read_text()

          primary_anchor = """      if (action == 'color.primaryWheels.reset') {\n"""
          primary_batch = """      if (action == 'color.primaryWheels.setWheel' && value is Map) {\n        final name = value['name']?.toString();\n        if (name == null ||\n            !const <String>{'lift', 'gamma', 'gain', 'offset'}.contains(name)) {\n          throw ArgumentError.value(name, 'name', 'Invalid Primary Wheels range.');\n        }\n        final r = value['r'];\n        final g = value['g'];\n        final b = value['b'];\n        final master = value['master'];\n        if (r is! num || g is! num || b is! num || master is! num) {\n          throw ArgumentError('Primary Wheels batch values must be numeric.');\n        }\n        final rv = r.toDouble();\n        final gv = g.toDouble();\n        final bv = b.toDouble();\n        final mv = master.toDouble();\n        if (!rv.isFinite || !gv.isFinite || !bv.isFinite || !mv.isFinite) {\n          throw ArgumentError('Primary Wheels batch values must be finite.');\n        }\n        _values['primary.${name}R'] = rv;\n        _values['primary.${name}G'] = gv;\n        _values['primary.${name}B'] = bv;\n        _values['primary.${name}Master'] = mv;\n        _flags['primary.enabled'] = true;\n        await _rebuildSelectedOperations();\n        return;\n      }\n\n"""
          assert primary_anchor in gateway
          if "color.primaryWheels.setWheel" not in gateway:
              gateway = gateway.replace(primary_anchor, primary_batch + primary_anchor, 1)

          log_anchor = """      if (action == 'color.logWheels.reset') {\n"""
          log_batch = """      if (action == 'color.logWheels.setWheel' && value is Map) {\n        final range = value['range']?.toString();\n        if (range == null ||\n            !const <String>{'shadows', 'midtones', 'highlights', 'global'}\n                .contains(range)) {\n          throw ArgumentError.value(range, 'range', 'Invalid Log Wheels range.');\n        }\n        final r = value['r'];\n        final g = value['g'];\n        final b = value['b'];\n        final master = value['master'];\n        if (r is! num || g is! num || b is! num || master is! num) {\n          throw ArgumentError('Log Wheels batch values must be numeric.');\n        }\n        final rv = r.toDouble();\n        final gv = g.toDouble();\n        final bv = b.toDouble();\n        final mv = master.toDouble();\n        if (!rv.isFinite || !gv.isFinite || !bv.isFinite || !mv.isFinite) {\n          throw ArgumentError('Log Wheels batch values must be finite.');\n        }\n        _values['log.$range.r'] = rv;\n        _values['log.$range.g'] = gv;\n        _values['log.$range.b'] = bv;\n        _values['log.$range.master'] = mv;\n        _flags['log.enabled'] = true;\n        await _rebuildSelectedOperations();\n        return;\n      }\n\n"""
          assert log_anchor in gateway
          if "color.logWheels.setWheel" not in gateway:
              gateway = gateway.replace(log_anchor, log_batch + log_anchor, 1)
          gateway_path.write_text(gateway)

          wheel_path = Path('lib/features/editor/presentation/professional_color_wheels.dart')
          wheels = wheel_path.read_text()
          wheels = re.sub(r"\n\s*fontFeatures: <FontFeature>\[\],", "", wheels)
          wheels = wheels.replace(
              "final radius = math.max(1.0, math.min(size.width, size.height) / 2 - 6);",
              "final radius = math.max(1.0, math.min(size.width, size.height) / 2 - 6).toDouble();")
          wheels = wheels.replace(
              "final radius = math.min(1.0, math.sqrt(puck.dx * puck.dx + puck.dy * puck.dy));",
              "final radius = math.min(1.0, math.sqrt(puck.dx * puck.dx + puck.dy * puck.dy)).toDouble();")
          wheel_path.write_text(wheels)
          PY

          git diff --check

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/engine/ffi_engine_gateway.dart \
                  lib/features/editor/presentation/editor_screen.dart \
                  lib/features/editor/presentation/professional_color_wheels.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add professional Primary and Log Wheels UI"
          git push origin HEAD:agent/davinci-style-primary-log-wheels-20260817
